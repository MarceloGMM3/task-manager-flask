<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestor de tareas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    <header class="site-header">
      <div class="header-content">
        <a class="brand" href="{{ url_for('tasks.index') }}">Gestor de tareas</a>
        <span class="brand-description">Organiza tu trabajo con claridad</span>
      </div>
    </header>
    <main class="container" id="main-content" tabindex="-1">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash flash-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">
          {{ message }}
        </p>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Task Manager · Flask y SQLite</p>
    </footer>
  </body>
</html>
